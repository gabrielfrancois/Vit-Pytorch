name: Quarto publish

on:
  push:
    branches: [reprod]

permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The website only executes a handful of Python cells at render time
      # (reading config files, displaying pre-computed plots). We therefore
      # skip the heavy training-time requirements.txt (which also contains
      # macOS-only pyobjc packages) and install only what the .qmd imports,
      # plus jupyter so Quarto can spin up the kernel.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            jupyter \
            matplotlib \
            numpy \
            pandas \
            pillow

      - name: Deploy to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
