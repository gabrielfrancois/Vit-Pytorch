name: Ruff Linter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ruff:
    runs-on: ubuntu-latest

      ```
    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Install Ruff
       run: pip install ruff

     - name: Run Ruff
       run: ruff check . --fix
         ```
